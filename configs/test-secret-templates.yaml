# Test migration configuration using new secret templates
# - MSSQL password: reads from Docker secret file
# - PG password: reads from environment variable

source:
  type: mssql
  host: mssql-server
  port: 1433
  database: StackOverflow2010
  user: sa
  password: ${file:/run/secrets/mssql_password}
  schema: dbo
  trust_server_cert: true

target:
  type: postgres
  host: postgres-target
  port: 5432
  database: so2010
  user: postgres
  password: ${env:PG_PASSWORD}
  schema: public
  ssl_mode: disable

migration:
  workers: 4
  chunk_size: 50000
  target_mode: drop_recreate
  include_tables:
    - Badges
    - Users
  data_dir: /state
