# Larger migration to test interruption and resume
source:
  type: mssql
  host: mssql-server
  port: 1433
  database: StackOverflow2010
  user: sa
  password: ${MSSQL_PASSWORD}
  schema: dbo
  trust_server_cert: true

target:
  type: postgres
  host: postgres-target
  port: 5432
  database: so2010
  user: postgres
  password: ${PG_PASSWORD}
  schema: public
  ssl_mode: disable

migration:
  workers: 2
  chunk_size: 20000
  target_mode: drop_recreate
  # Include all tables for longer migration
  include_tables: []
  exclude_tables: []
  data_dir: /state
