# Test migration configuration for SO2010 dataset
# Uses existing MSSQL and PostgreSQL containers

source:
  type: mssql
  host: mssql-server
  port: 1433
  database: StackOverflow2010
  user: sa
  password: ${MSSQL_PASSWORD}
  schema: dbo
  trust_server_cert: true

target:
  type: postgres
  host: postgres-target
  port: 5432
  database: so2010
  user: postgres
  password: ${PG_PASSWORD}
  schema: public
  ssl_mode: disable

migration:
  workers: 4
  chunk_size: 50000
  target_mode: drop_recreate
  include_tables:
    - Badges
    - Users
  data_dir: /state
