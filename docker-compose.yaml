# Airflow 3 with DockerOperator for mssql-pg-migrate
# Based on Apache Airflow official docker-compose

x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  image: airflow-mssql-pg-migrate:3.0.1
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Airflow 3: Configure Execution API URL for LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    # Airflow 3: JWT secret for component authentication
    AIRFLOW__API_AUTH__JWT_SECRET: c985b2e5b423787b932d0ecdea37b251349a8a5bea13436a476d2e36b04a8be7
    # Airflow 3: Simple auth manager - allow all users as admin (dev only)
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # Fernet key loaded from Docker secret via command
    AIRFLOW__CORE__FERNET_KEY_CMD: "cat /run/secrets/fernet_key"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Airflow 3: renamed from deactivate_stale_dags_interval
    AIRFLOW__SCHEDULER__PARSING_CLEANUP_INTERVAL: '60'
    # Mount paths for DockerOperator (passed from .env)
    CONFIG_MOUNT_PATH: ${CONFIG_MOUNT_PATH:-${PWD}/configs}
    STATE_MOUNT_PATH: ${STATE_MOUNT_PATH:-${PWD}/state}
    DATABASE_NETWORK: ${DATABASE_NETWORK:-mssql-to-postgres-pipeline_airflow}
    # Database credentials loaded from Docker secrets (see secrets: section)
  volumes:
    - ./dags:/opt/airflow/dags
    - ./configs:/opt/airflow/configs
    - ./logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  secrets:
    - fernet_key
    - mssql_password
    - pg_password
  user: "${AIRFLOW_UID:-50000}:0"
  group_add:
    - "1001"  # docker group
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # Airflow 3: API server replaces webserver
  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Airflow 3: dag-processor must run separately
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "DagProcessorJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/configs
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,configs}
        airflow db migrate
        echo "Airflow initialized successfully"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
    user: "0:0"
    volumes:
      - .:/sources

  # mssql-pg-migrate image - build once, used by DockerOperator
  mssql-pg-migrate:
    build:
      context: ./docker/mssql-pg-migrate
      args:
        VERSION: "1.24.0"
    image: mssql-pg-migrate:1.24.0
    profiles:
      - build-only
    command: ["--version"]

volumes:
  postgres-db-volume:

networks:
  default:
    name: airflow-network

secrets:
  fernet_key:
    file: ${HOME}/.secrets/fernet_key
  mssql_password:
    file: ${HOME}/.secrets/mssql_password
  pg_password:
    file: ${HOME}/.secrets/pg_password
